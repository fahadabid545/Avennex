<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Avennex Admin Center</title>
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=202609112200">
  <link rel="stylesheet" href="../css/dashboard.css?v=202609112200">
  <link rel="stylesheet" href="css/admin-theme.css?v=202609112200">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('admin_theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body class="dashboard-page">
  <aside class="sidebar">
    <a href="../index.html" class="sidebar-logo"><span class="logo-aven">aven</span><span class="logo-nex">nex</span></a>
    <nav class="sidebar-nav">
      <button class="sidebar-link active" data-module="blogs">Blogs</button>
      <button class="sidebar-link" data-module="jobs">Jobs</button>
      <button class="sidebar-link" data-module="products">Products</button>
      <button class="sidebar-link" data-module="launchpad">Launchpad</button>
      <button class="sidebar-link" data-module="academy">Academy</button>
      <button class="sidebar-link" data-module="chat">Home Chat</button>
      <button class="sidebar-link" data-module="faqs">FAQs</button>
      <button class="sidebar-link" data-module="chatbot">Chatbot</button>
      <button class="sidebar-link" data-module="dashboard">Dashboard</button>
      <button class="sidebar-link" data-module="settings">Settings</button>
      <button class="sidebar-link" data-module="team">Team</button>
    </nav>
    <div class="sidebar-bottom">
      <button class="sidebar-link sidebar-logout" id="logout-btn">Log out</button>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <span class="topbar-title">Avennex Admin Center</span>
      <div class="topbar-right">
        <div class="theme-toggle" role="group" aria-label="Panel theme">
          <button type="button" data-theme-set="dark">Dark</button>
          <button type="button" data-theme-set="light">Light</button>
        </div>
        <span class="topbar-email" id="admin-email"></span>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>

  <script src="https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/pdfjs-dist@3.4.120/build/pdf.min.js"></script>
  <script src="js/admin-api.js?v=202609112200"></script>
  <script src="js/admin-auth.js?v=202609112200"></script>
  <script src="js/admin-theme.js?v=202609112200"></script>
  <script src="js/admin-security.js?v=202609112200"></script>
  <script src="../js/dashboard.js?v=202609112200"></script>
  <script src="js/admin-dashboard.js?v=202609112200"></script>
  <script src="js/admin-app.js?v=202609112200"></script>
</body>
</html>
