name: keep prod awake

# Render's free plan sleeps after 15 minutes without traffic. Scheduled runs
# only fire from the default branch, so this pings production and nothing else.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the production API
        run: curl -sS -o /dev/null -w "%{http_code} in %{time_total}s\n" --max-time 120 --retry 2 https://avennex.onrender.com/api/health || true
